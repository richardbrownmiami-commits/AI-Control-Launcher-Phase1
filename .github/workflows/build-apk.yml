name: Build ARMv7a Android 11 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_launcher:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
      CMAKE_VERSION: "3.31.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify debug APK is ARMv7a-only
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "Debug APK:"
          ls -lh "$APK"
          mapfile -t libs < <(unzip -Z1 "$APK" | awk '/^lib\/.*[.]so$/ {print}')
          printf '%s\n' "Native libraries: ${libs[@]:-<none>}"
          for lib in "${libs[@]}"; do
            [[ -z "$lib" ]] && continue
            [[ "$lib" == lib/armeabi-v7a/* ]] || { echo "FAIL: $lib"; exit 1; }
          done
          echo "PASS: debug APK contains only ARMv7a native code (or no native libraries)."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-control-launcher-debug-armv7a
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify release APK is ARMv7a-only
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          echo "Release APK:"
          ls -lh "$APK"
          mapfile -t libs < <(unzip -Z1 "$APK" | awk '/^lib\/.*[.]so$/ {print}')
          printf '%s\n' "Native libraries: ${libs[@]:-<none>}"
          for lib in "${libs[@]}"; do
            [[ -z "$lib" ]] && continue
            [[ "$lib" == lib/armeabi-v7a/* ]] || { echo "FAIL: $lib"; exit 1; }
          done
          echo "PASS: release APK contains only ARMv7a native code (or no native libraries)."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-control-launcher-release-armv7a
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
