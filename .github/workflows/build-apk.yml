name: Build ARMv7a Android 11 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_launcher:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
      CMAKE_VERSION: "3.31.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify ARMv7a-only APKs
        run: |
          set -euo pipefail
          for APK in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            test -f "$APK"
            echo "APK: $APK"
            ls -lh "$APK"
            python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              libs = [n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")]
          print("Native libraries:", libs)
          if not libs:
              raise SystemExit("FAIL: no native library; ARMv7a guard is missing")
          forbidden = [n for n in libs if not n.startswith("lib/armeabi-v7a/")]
          if forbidden:
              raise SystemExit("FAIL: non-ARMv7 native libraries: " + ", ".join(forbidden))
          print("PASS: only armeabi-v7a native code is packaged.")
          PY
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-control-launcher-armv7a-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
