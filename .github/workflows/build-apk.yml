name: Build ARMv7a Android 11 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_launcher:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
      CMAKE_VERSION: "3.31.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARMv7a release APK only
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify ARMv7a-only APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              libs = [n for n in z.namelist() if n.startswith("lib/") and n.endswith(".so")]
          print("Native libraries:")
          for lib in libs:
              print("  " + lib)
          required = [n for n in libs if n.startswith("lib/armeabi-v7a/")]
          forbidden = [n for n in libs if not n.startswith("lib/armeabi-v7a/")]
          if not required:
              raise SystemExit("FAIL: no armeabi-v7a native library")
          if forbidden:
              raise SystemExit("FAIL: non-ARMv7 native libraries: " + ", ".join(forbidden))
          print("PASS: only lib/armeabi-v7a native code is packaged.")
          PY

      - name: Upload ARMv7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-control-launcher-armv7a-android11
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
