name: Build ARMv7a Android 11 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_launcher:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify APK outputs
        run: |
          set -e
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"

          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"

          ls -lh "$DEBUG_APK" "$RELEASE_APK"

          python3 - "$DEBUG_APK" "$RELEASE_APK" <<'PY'
          import sys
          import zipfile

          for apk_path in sys.argv[1:]:
              with zipfile.ZipFile(apk_path) as z:
                  native = [
                      n for n in z.namelist()
                      if n.startswith("lib/") and n.endswith(".so")
                  ]
              unsupported = [
                  n for n in native
                  if not n.startswith("lib/armeabi-v7a/")
              ]
              print(f"{apk_path}: native libraries = {native}")
              if unsupported:
                  print(f"FAIL: unsupported native ABI entries: {unsupported}")
                  raise SystemExit(1)

          print("APK verification passed: no arm64-v8a/x86/x86_64 native libraries.")
          print("This launcher is pure Kotlin/Java and may contain no native .so files.")
          PY

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-control-launcher-phase1-armv7-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
