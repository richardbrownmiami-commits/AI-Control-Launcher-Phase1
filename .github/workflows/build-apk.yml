name: Build ARMv7a Android 9-15 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_launcher:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
      CMAKE_VERSION: "3.31.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true

      - name: Install Android SDK, NDK and CMake
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify debug APK Android 9-15
        run: |
          aapt dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/badging.txt
          grep -q "minSdkVersion:'28'" /tmp/badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/badging.txt

      - name: Verify debug APK is ARMv7a-compatible
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          if not apk.is_file():
              raise SystemExit(f"Missing APK: {apk}")

          native = [n for n in zipfile.ZipFile(apk).namelist()
                    if n.startswith("lib/") and n.endswith(".so")]
          bad = [n for n in native if not n.startswith("lib/armeabi-v7a/")]

          print(f"Debug APK: {apk} ({apk.stat().st_size} bytes)")
          print("Native libraries:", native or "<none>")
          if bad:
              raise SystemExit("FAIL: non-ARMv7a native libraries: " + ", ".join(bad))
          print("PASS: debug APK contains only ARMv7a native code (or no native libraries).")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-control-launcher-debug-armv7a
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify release APK is ARMv7a-compatible
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          apk = Path("app/build/outputs/apk/release/app-release.apk")
          if not apk.is_file():
              raise SystemExit(f"Missing APK: {apk}")

          native = [n for n in zipfile.ZipFile(apk).namelist()
                    if n.startswith("lib/") and n.endswith(".so")]
          bad = [n for n in native if not n.startswith("lib/armeabi-v7a/")]

          print(f"Release APK: {apk} ({apk.stat().st_size} bytes)")
          print("Native libraries:", native or "<none>")
          if bad:
              raise SystemExit("FAIL: non-ARMv7a native libraries: " + ", ".join(bad))
          print("PASS: release APK contains only ARMv7a native code (or no native libraries).")
          PY

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-control-launcher-release-armv7a
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
